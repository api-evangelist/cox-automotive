deprecation:
  policy_url: https://developer.manheim.com/apis/events/subscriptions.html
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Cox Automotive publishes no deprecation POLICY — no notice period, no sunset schedule, no RFC 8594
    Sunset/Deprecation header support is documented anywhere. What it does publish is a concrete,
    in-flight deprecation, announced inline at the top of the affected reference pages: the Manheim
    Events and Subscriptions APIs are "no longer available for onboarding", superseded by Eventer on the
    Cox Automotive API Storefront. Existing consumers are told to contact Cox Automotive for access to
    the replacement. No retirement date is given for the old surface.
  deprecated_surfaces:
  - surface: Manheim Events API (/events)
    status: closed-to-new-onboarding
    replacement: Eventer (Cox Automotive API Storefront)
    retirement_date: not published
    docs: https://developer.manheim.com/apis/events/events.html
  - surface: Manheim Subscriptions API (/subscriptions)
    status: closed-to-new-onboarding
    replacement: Eventer (Cox Automotive API Storefront)
    retirement_date: not published
    docs: https://developer.manheim.com/apis/events/subscriptions.html
  - surface: Manheim legacy OAuth token endpoint (https://api.manheim.com/oauth2/token)
    status: retained-for-legacy-clients
    replacement: https://api.manheim.com/oauth2/token.oauth2
    note: >-
      Clients authenticating with a Company ID MUST keep using the legacy endpoint; new clients use
      token.oauth2. Two live token endpoints with opposite instructions per client class.
    docs: https://developer.manheim.com/pages/authentication.html
