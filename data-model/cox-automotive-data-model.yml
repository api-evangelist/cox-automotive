manheim_entities:
- name: Unit
  description: A vehicle in the Manheim inventory system.
  endpoints:
  - GET /units/id/{ID}
  - GET /units/mine
  - POST /units
  - POST /units/id/{ID}
  source: https://developer.manheim.com/apis/inventory/units.html
- name: Consignment
  description: A unit consigned to an auction.
  endpoints:
  - GET /consignments/id/{ID}
  - GET /consignments/unit/{ID}
  - GET /consignments/mine
  - GET /consignments/lifecycles/unit/{LIFECYCLE_ID}
  source: https://developer.manheim.com/apis/inventory/consignments.html
- name: Offering
  description: A unit offered for sale in a channel (in-lane, OVE, MBOnDemand, direct sales, ACTUOS).
  endpoints:
  - GET /offerings/unit/{ID}
  - GET /offerings/consignment/{ID}
  - GET /offerings/search
  - POST /offerings/in-lane
  - POST /offerings/ove
  - POST /offerings/actions/assign_lane_and_run
  - POST /offerings/actions/unassign_lane_and_run
  source: https://developer.manheim.com/apis/marketplace/offerings.html
- name: Transaction
  description: A completed sale keyed by customer, auction, sale year/number, lane and run, or by VIN.
  endpoints:
  - GET /transactions/customer/{ID}
  - GET /transactions/customer/{ID}/auction/{auctionCode}/vin/{VIN}
  source: https://developer.manheim.com/apis/marketplace/transactions.html
- name: Purchase
  description: A purchase order against a transaction.
  endpoints:
  - GET /orders/purchases/id/{ID}
  - GET /orders/purchases/customer/{ID}
  source: https://developer.manheim.com/apis/marketplace/purchases.html
- name: Title
  description: Title details for a sold vehicle.
  endpoints:
  - GET /titles/details/id/{titleID}
  source: https://developer.manheim.com/apis/marketplace/titles.html
- name: Valuation
  description: Manheim Market Report valuation for a VIN, with region, colour, grade and odometer qualifiers, plus forecasts.
  endpoints:
  - GET /valuations/vin/{VIN}
  - POST /valuations/batch/vins
  - GET /valuations/forecast/vin/{VIN}
  - POST /valuations/batch/forecast/vins
  source: https://developer.manheim.com/apis/marketplace/valuations.html
- name: Location
  description: A Manheim auction location.
  endpoints:
  - GET /locations
  - GET /locations/id/{ID}
  source: https://developer.manheim.com/apis/auction/locations.html
- name: Profile
  description: A user or organisation profile, resolvable by source system and alternate id.
  endpoints:
  - GET /profiles/mine
  - GET /profiles/id/{profileId}
  - GET /profiles/alternateIdTypes
  source: https://developer.manheim.com/apis/users/profiles.html
- name: Preference
  description: A user preference under a profile, typed by a preference definition.
  endpoints:
  - GET /preferences/mine
  - GET /preferences/profile/{profileId}
  - POST /preferences
  - DELETE /preferences/id/{preferenceId}
  source: https://developer.manheim.com/apis/users/preferences.html
- name: Context
  description: A context grouping preferences.
  endpoints:
  - GET /contexts/all
  - GET /contexts/id/{contextId}
  - POST /contexts
  source: https://developer.manheim.com/apis/users/contexts.html
- name: Subscriber
  description: A company registered to receive Manheim event notifications.
  endpoints:
  - GET /subscribers/mine
  - POST /subscribers
  - DELETE /subscribers/id/{ID}
  source: https://developer.manheim.com/apis/events/subscribers.html
- name: Subscription
  description: Filter criteria under a subscriber selecting which events are delivered.
  endpoints:
  - GET /subscriptions/mine
  - POST /subscriptions
  - DELETE /subscriptions/id/{ID}
  source: https://developer.manheim.com/apis/events/subscriptions.html
- name: Event
  description: A NOUN.VERB business event with a thin body carrying the changed resource URL.
  endpoints:
  - POST /events
  - GET /events/id/{ID}
  - GET /events/subscriber/{ID}
  - GET /events/subscription/{ID}
  source: https://developer.manheim.com/apis/events/events.html
