environments:
  production: https://api.manheim.com
  pre_production: https://uat.api.manheim.com
  qa: https://integration1.api.manheim.com
authentication:
  grant: client_credentials
  token_endpoint: https://api.manheim.com/oauth2/token
  note: >-
    External customers calling the Subscriptions API with the client_credentials grant MUST use the
    legacy token endpoint (https://api.manheim.com/oauth2/token), not token.oauth2 — this applies to
    every create, update, retrieve and delete method on that API.
  docs: https://developer.manheim.com/pages/authentication.html
gap:
  finding: >-
    A well-designed event surface with filtering, replay and response expansion, and no machine-readable
    description of it — no AsyncAPI, no event-type registry, no payload schema, no signature scheme and
    no retry policy. A consumer cannot generate a handler or validate a delivery from anything Cox
    Automotive publishes.
  remedy: >-
    Publish an AsyncAPI 3.x document for Eventer covering channels, the event-type enumeration, the
    envelope schema and the callback security scheme.
