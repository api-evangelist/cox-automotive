note: >-
  No Cox Automotive surface returns application/problem+json from a documented endpoint, so there are no
  RFC 9457 problem types to catalogue. Three different error envelopes are in use. (1) Manheim returns an
  `errors[]` array of {property, message, developerMessage} alongside an X-Manheim-Media-Type header.
  (2) Kelley Blue Book Instant Cash Offer wraps every response in a meta/data envelope whose
  `meta.codes[]` carries six-digit Cox Automotive result codes — see errors/cox-automotive-error-codes.yml.
  (3) IDWS 4.0 returns an IDWS.Platform.ResponseMessage.ReturnResponse object. One Cox Automotive host
  DOES emit RFC 9457: control.api.coxautoinc.com answered a probe of /products with
  `application/problem+json` and an rfc9110 `type` URI, but that is the developer-portal control plane
  rather than a documented product API, so it is recorded in conformance/ and not here.
