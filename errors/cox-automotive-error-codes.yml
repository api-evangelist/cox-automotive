applies_to: Kelley Blue Book Instant Cash Offer (ICO) API
envelope_field: meta.codes[]
note: 'Cox Automotive''s Kelley Blue Book Instant Cash Offer API publishes a six-digit numeric result-code registry
  carried in the response envelope''s meta.codes[] array. The leading three digits mirror the HTTP status (200xxx
  success, 4xxxxx client error, 5xxxxx server error) and the trailing three identify the specific condition. This
  is the non-payments sibling of a decline-code table: it is the registry an integrator needs to tell ''this VIN
  is not eligible'' apart from ''this request was malformed''. Captured verbatim from the published reference; no
  code was inferred.'
