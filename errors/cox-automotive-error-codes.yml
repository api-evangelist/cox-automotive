offer_statuses:
- status: CLEARED
  description: This is the normal state of an Offer that is not pending review, but has not been taken in by a dealer.
  occurs_when: Offer Created
- status: INELIGIBLE
  description: This will happen when an ICO cannot be given for the entered vehicle (Insufficient market data, recently
    auctioned, intentionally disqualified vehicles, etc.).
  occurs_when: Offer Created
- status: FR
  description: This is the status that indicates that an offer is pending review by adjusters. It will stay in this
    status until manually changed by an adjuster, at which point it could become CLEARED or INSPECTION or INELIGIBLE.
  occurs_when: Offer Created
- status: EXPIRED
  description: This happens when an Offer has expired.
  occurs_when: Dealer / Adjuster Interaction
- status: INSPECTION
  description: This happens when an adjuster marks the Offer for inspection by a dealer instead of offsetting it.
  occurs_when: Certain conditions are selected / Dealer / Adjuster Interaction
- status: AUCTION
  description: This happens after the dealer has taken it in, grounded it, and sent it to auction.
  occurs_when: Dealer / Adjuster Interaction
- status: CONFIRMED
  description: This happens after the dealer has taken it in and inspected the vehicle and confirmed its condition.
  occurs_when: Dealer / Adjuster Interaction
- status: GROUNDED
  description: This happens after the dealer has accepted the vehicle from the customer.
  occurs_when: Dealer / Adjuster Interaction
- status: PURCHASED
  description: This happens when a dealer has taken it in, grounded it, and decided to keep it on their lot as inventory.
  occurs_when: Dealer / Adjuster Interaction
- status: RECEIVED
  description: This happens when the vehicle has been received at an auction.
  occurs_when: Dealer / Adjuster Interaction
- status: SOLD
  description: This happens when the vehicle has been sold at an auction.
  occurs_when: Dealer / Adjuster Interaction
