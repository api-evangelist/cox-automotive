        type: string
        required: true
        minLength: 2
        maxLength: 2
        x-valid: CA
        x-invalid: foo
      - name: plateNumber
        in: path
        description: The license plate number
        type: string
        required: true
        minLength: 7
        maxLength: 7
        x-valid: 9SCA339
        x-invalid: foo
