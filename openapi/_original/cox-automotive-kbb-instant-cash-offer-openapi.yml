          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - type: object
              required:
              - data
              properties:
                meta:
                  type: object
                  properties:
                    codes:
                      type: array
                      items:
                        type: integer
                        enum:
                        - 201000
                        - 200422
                        description: '200100 - Prospect created.

