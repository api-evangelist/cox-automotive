definitions:
  Response:
    properties:
      meta:
        type: object
        required:
        - codes
        properties:
          codes:
            type: array
            items:
              type: integer
              minimum: 0
          links:
            type: array
            items:
              type: object
              properties:
                rel:
                  type: string
                  enum:
                  - required
                  - optional
                  - self
                  - doc
                  - deprecated
                  - next
                  - error
                href:
                  type: string
                  format: uri
                method:
                  type: string
                  enum:
                  - GET
                  - POST
                  - PATCH
                properties:
                  type: object
                templated:
                  type: boolean
  DecodedVin:
    type: object
    properties:
      possibilities:
        type: array
        description: This array of possible vehicle components based on the VIN.
        items:
          $ref: '#/definitions/VinPossibility'
  VinPossibility:
    type: object
    properties:
      year:
        $ref: '#/definitions/Year'
      make:
        $ref: '#/definitions/Make'
      model:
        $ref: '#/definitions/Model'
      trim:
        $ref: '#/definitions/Trim'
      drivetrains:
        type: array
        description: The possible drivetrains for this Trim based on the VIN. It is possible that only one item will be present,
          in which case it is the only item applicable for the trim.
        items:
          $ref: '#/definitions/Drivetrain'
      engines:
        type: array
        description: The possible engines for this Trim based on the VIN. It is possible that only one item will be present,
          in which case it is the only item applicable for this Trim.
        items:
          $ref: '#/definitions/Engine'
      transmissions:
        type: array
        description: The possible transmissions for this Trim based on the VIN. It is possible that only one item will be
          present, in which case it is the only item applicable for the trim.
        items:
          $ref: '#/definitions/Transmission'
      options:
        type: array
        description: All of the options applicable for this Trim based on the VIN. Whether the Option is selected by default
          is determined by the VIN.
        items:
          $ref: '#/definitions/Option'
  VehicleIdentity:
    type: object
    required:
    - yearId
    - makeId
    - modelId
    - trimId
    - transmissionId
    - engineId
    - drivetrainId
    - colorId
    properties:
      yearId:
        type: integer
        minimum: 0
      makeId:
        type: integer
        minimum: 0
      modelId:
        type: integer
        minimum: 0
      trimId:
        type: integer
        minimum: 0
      transmissionId:
        type: integer
        minimum: 0
      engineId:
        type: integer
        minimum: 0
      drivetrainId:
        type: integer
        minimum: 0
      colorId:
        type: integer
        minimum: 0
      vin:
        type: string
        minLength: 0
        maxLength: 17
  VehicleEligibility:
    type: object
    properties:
      isEligible:
        type: boolean
      excludedEngines:
        type: array
        items:
          type: integer
      excludedDrivetrains:
        type: array
        items:
          type: integer
      excludedTransmissions:
        type: array
        items:
          type: integer
  ProspectRequest:
    type: object
    required:
    - vehicle
    - mileage
    - dealerId
    properties:
      vehicle:
        $ref: '#/definitions/VehicleIdentity'
      mileage:
        type: integer
        minimum: 0
        maximum: 1000000
      dealerId:
        type: integer
        minimum: 0
      incomingUrl:
        type: string
  Prospect:
    type: object
    allOf:
    - $ref: '#/definitions/ProspectRequest'
    - type: object
      required:
      - prospectId
      - status
      properties:
        prospectId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - inProgress
          - submitted
          - canSubmit
        history:
          $ref: '#/definitions/Questions'
        options:
          $ref: '#/definitions/Options'
        conditions:
          $ref: '#/definitions/Questions'
        contactInfo:
          $ref: '#/definitions/ContactInfo'
  Year:
    type: object
    required:
    - yearId
    - displayName
    properties:
      yearId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Years:
    description: An array of vehicle years.
    type: array
    items:
      $ref: '#/definitions/Year'
  Make:
    type: object
    required:
    - makeId
    properties:
      makeId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Makes:
    description: An array of vehicle makes.
    type: array
    items:
      $ref: '#/definitions/Make'
  Model:
    type: object
    required:
    - modelId
    properties:
      modelId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Models:
    description: An array of vehicle models.
    type: array
    items:
      $ref: '#/definitions/Model'
  Trim:
    type: object
    required:
    - trimId
    properties:
      trimId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Trims:
    description: An array of vehicle trims.
    type: array
    items:
      $ref: '#/definitions/Trim'
  Color:
    type: object
    required:
    - colorId
    properties:
      colorId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Colors:
    description: An array of vehicle colors.
    type: array
    items:
      $ref: '#/definitions/Color'
  Transmission:
    type: object
    required:
    - transmissionId
    properties:
      transmissionId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Transmissions:
    description: An array of vehicle transmissions.
    type: array
    items:
      $ref: '#/definitions/Transmission'
  Engine:
    type: object
    required:
    - engineId
    properties:
      engineId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Engines:
    description: An array of vehicle engines.
    type: array
    items:
      $ref: '#/definitions/Engine'
  Drivetrain:
    type: object
    required:
    - drivetrainId
    properties:
      drivetrainId:
        type: integer
        minimum: 0
      displayName:
        type: string
  Drivetrains:
    description: An array of vehicle drivetrains.
    type: array
    items:
      $ref: '#/definitions/Drivetrain'
  OptionRequest:
    type: object
    required:
    - optionId
    - isSelected
    properties:
      optionId:
        type: integer
        minimum: 0
      isSelected:
        type: boolean
  OptionsRequest:
    description: An Option with its selected value.
    type: array
    items:
      $ref: '#/definitions/OptionRequest'
  Option:
    allOf:
    - $ref: '#/definitions/OptionRequest'
    - type: object
      properties:
        displayName:
          type: string
        groupName:
          type: string
  Options:
    description: An array of vehicle makes.
    type: array
    items:
      $ref: '#/definitions/Option'
  QuestionRequest:
    allOf:
    - type: object
      required:
      - questionId
      properties:
        questionId:
          type: string
