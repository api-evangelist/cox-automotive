paths:
  /{version}/cto/default:
    get:
      description: The cost of ownership resources will provide the developer the dataset and segments for 5 year cost to
        own
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/parameters/version'
      - $ref: '#/parameters/vehicleIds'
      - $ref: '#/parameters/zipcode'
      - $ref: '#/parameters/campaign-key'
      - $ref: '#/parameters/dataVersionId'
      - name: annualMileage
        in: query
        type: integer
        required: false
        description: Annual Mileage
      - name: loanTerm
        in: query
        type: integer
        required: false
        description: Loan Term
        enum:
        - 0
        - 12
        - 24
        - 36
        - 48
        - 60
      - name: downPayment
        in: query
        type: number
        required: false
        description: Down Payment
      - name: apr
        in: query
        type: number
        required: false
        description: APR
      responses:
        200:
          description: Successful response
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - type: object
              required:
              - results
              properties:
                results:
                  $ref: '#/definitions/CTO'
        500:
          description: Server Exception
  /{version}/pricing/default/{class}:
    get:
