definitions:
  Response:
    type: object
    properties:
      dataVersion:
        $ref: '#/definitions/DataVersion'
  DataVersion:
    type: object
    required:
    - dataVersionId
    - startDate
    - endDate
    properties:
      dataVersionId:
        type: string
      startDate:
        type: string
        format: date
      endDate:
        format: date
        type: string
  CTO:
    type: object
    properties:
      vehicleId:
        type: integer
      zipCode:
        type: string
      regionId:
        type: integer
      isNationalPricing:
        type: boolean
      costPerMile:
        type: number
        format: float
      fiveYearTotalCostSum:
        type: integer
      fiveYearTotalCostAvg:
        type: integer
      fuel:
        $ref: '#/definitions/CTOAttribute'
      insurance:
        $ref: '#/definitions/CTOAttribute'
      finance:
        $ref: '#/definitions/CTOAttribute'
      stateFees:
        $ref: '#/definitions/CTOAttribute'
      maintenance:
        $ref: '#/definitions/CTOAttribute'
      repairs:
        $ref: '#/definitions/CTOAttribute'
      depreciation:
        $ref: '#/definitions/CTOAttribute'
      yearSummary:
        $ref: '#/definitions/CTOYearSummary'
  CTOAttribute:
    type: object
    properties:
      description:
        type: string
      label:
        type: string
      totalSum:
        type: integer
      totalAvg:
        type: integer
      years:
        type: object
        properties:
          1:
            type: integer
          2:
            type: integer
          3:
            type: integer
          4:
            type: integer
          5:
            type: integer
  CTOYearSummary:
    type: object
    properties:
      yearId:
        type: integer
      totalSum:
        type: integer
  Pricing:
    type: object
    properties:
      vehicleId:
        type: integer
      zipCode:
        type: integer
      regionId:
        type: integer
      isNationalPricing:
        type: boolean
      prices:
        type: array
        items:
          type: object
          description: '``` - 108 | Certified Pre-OwnedUsed - 130 | Used Car Fair Purchase PriceUsed - 4   | Trade-In Value:
