                  properties:
                    results:
                      $ref: '#/components/schemas/Vehicle'
      summary: Get by version vehicle
      x-summary-source: derived
      operationId: getByVersionVehicle
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/fuelcost/configured:
    post:
      description: The fuel cost calculator s used to illustrate an annual fuel cost savings of a vehicle
      parameters:
      - name: version
        in: path
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - v1
          - v2
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      security:
      - keyQuery: []
      tags:
      - Vehicle
      responses:
        200:
