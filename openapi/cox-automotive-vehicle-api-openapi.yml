      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  vehicleId:
                    type: integer
        description: 'VehicleId is required. Note: The request body is an array of requests so you will need the begin and end square brackets even requesting only 1 vehicle.

          '
        required: true
      summary: Create by version fuelcost default
      x-summary-source: derived
      operationId: postByVersionFuelcostDefault
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
