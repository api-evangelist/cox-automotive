                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      $ref: '#/components/schemas/FuelCost'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  vehicleId:
                    type: integer
                  engineOptionId:
                    type: integer
                  drivetrainOptionId:
                    type: integer
                  transmissionOptionId:
                    type: integer
        required: true
      summary: Create by version fuelcost configured
      x-summary-source: derived
      operationId: postByVersionFuelcostConfigured
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/fuelcost/default:
