openapi: 3.2.0
info:
  title: Cox Automotive Vehicle API
  version: '1.0'
  description: 'Operations tagged Vehicle across 3 of this provider''s published API definitions: cox-automotive-kbb-advertising-data-openapi.yaml, cox-automotive-kbb-idws-vehicle-openapi.json, cox-automotive-kbb-instant-cash-offer-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.api.kbb.com/ads
- url: https://idws-sandbox.datasolutions.coxautoinc.com
- url: https://api.kbb.com/ico/v1
tags:
- name: Vehicle
  description: All methods related to vehicles
paths:
  /{version}/cto/default:
    get:
      description: The cost of ownership resources will provide the developer the dataset and segments for 5 year cost to own
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/vehicleIds'
      - $ref: '#/components/parameters/zipcode'
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      - name: annualMileage
        in: query
        required: false
        description: Annual Mileage
        schema:
          type: integer
      - name: loanTerm
        in: query
        required: false
        description: Loan Term
        schema:
          type: integer
          enum:
          - 0
          - 12
          - 24
          - 36
          - 48
          - 60
      - name: downPayment
        in: query
        required: false
        description: Down Payment
        schema:
          type: number
      - name: apr
        in: query
        required: false
        description: APR
        schema:
          type: number
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      $ref: '#/components/schemas/CTO'
        500:
          description: Server Exception
      summary: Get by version cto default
      x-summary-source: derived
      operationId: getByVersionCtoDefault
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/pricing/default/{class}:
    get:
      description: The pricing resource provide Kelley Blue book pricing information using the vehicles default configuration.
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - name: class
        description: 'new - New Car

          used - Used Car

          '
        in: path
        required: true
        schema:
          type: string
          enum:
          - new
          - used
      - $ref: '#/components/parameters/vehicleIds'
      - $ref: '#/components/parameters/zipcode'
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      $ref: '#/components/schemas/Pricing'
      summary: Get by version pricing default by class
      x-summary-source: derived
      operationId: getByVersionPricingDefaultByClass
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/ratings/expert:
    get:
      description: 'The expert ratings resource provides vehicle ratings content by Kelley Blue Book. The following ratings content secrtions are available in the response object. ``` - 2000003070 | Overall Overal Rating - 2000003071 | Driving Dynamicst - 2000003072 | Comfort & Convenience - 2000003073 | Design: Interios & Exterior - 2000003074 | Safety - 2000003075 | Value ```

        - Notes:

        - If you pass in vehicleIds, then you should not pass in yearId, makeId, modelId and vice versa.

        - Base vehicleId is going to be returned in the output when querying by yearId, makeId, modelId.'
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - name: vehicleIds
        in: query
        description: Comma seperated list of Vehicle id's
        required: false
        schema:
          type: string
      - name: yearId
        in: query
        required: false
        description: Year ID
        schema:
          type: integer
      - name: makeId
        in: query
        required: false
        description: Make ID
        schema:
          type: integer
      - name: modelId
        in: query
        required: false
        description: Model ID
        schema:
          type: integer
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - expertRatings
                  properties:
                    expertRatings:
                      $ref: '#/components/schemas/ExpertRatings'
      summary: Get by version ratings expert
      x-summary-source: derived
      operationId: getByVersionRatingsExpert
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/ratings/consumer:
    get:
      description: 'The consumer ratings resource provides vehicle ratings content producted by users. The following ratings content sections are available in the response object.

        - Overal Rating - Comfort - Performance - Quality - Reliability - Styling - Value

        - Notes:

        - If you pass in vehicleIds, then you should not pass in yearId, makeId, modelId and vice versa.

        - Base vehicleId is going to be returned in the output when querying by yearId, makeId, modelId.'
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - name: vehicleIds
        in: query
        description: Comma seperated list of Vehicle id's
        required: false
        schema:
          type: string
      - name: yearId
        in: query
        required: false
        description: Year ID
        schema:
          type: integer
      - name: makeId
        in: query
        required: false
        description: Make ID
        schema:
          type: integer
      - name: modelId
        in: query
        required: false
        description: Model ID
        schema:
          type: integer
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - consumerRatings
                  properties:
                    consumerRatings:
                      $ref: '#/components/schemas/ConsumerRatings'
      summary: Get by version ratings consumer
      x-summary-source: derived
      operationId: getByVersionRatingsConsumer
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/reviews/expert:
    get:
      description: 'The expert review resource proviudes editoral content produced by Kelley Blue Book. The following content sections are available in the response object. ``` - 34 | KBB Editor''s Overview - 35/36 | What''s New for [Vehicle Model Year] - 37 | You''ll Like This Car If... - 38 | You May Not Like This Car If... - 39 | Exterior - 40 | Interior - 41 | Notable Standard Equipment - 42 | Notable Optional Equipment - 43 | Pricing Notes - 44 | Driving Impressions - 45 | Favorite Features - 46 | Under the Hood - 2000003080 | Overview - 2000003081 | Teaser ```

        - Notes:

        - If you pass in vehicleId, then you should not pass in yearId, makeId, modelId and vice versa.

        - Base vehicleId is going to be returned in the output when querying by yearId, makeId, modelId.'
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - name: vehicleId
        in: query
        description: The KBB vehicle identifier
        required: false
        schema:
          type: integer
      - name: yearId
        in: query
        required: false
        description: Year ID
        schema:
          type: integer
      - name: makeId
        in: query
        required: false
        description: Make ID
        schema:
          type: integer
      - name: modelId
        in: query
        required: false
        description: Model ID
        schema:
          type: integer
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - expertReview
                  properties:
                    expertReview:
                      $ref: '#/components/schemas/ExpertReveiws'
      summary: Get by version reviews expert
      x-summary-source: derived
      operationId: getByVersionReviewsExpert
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
  /{version}/reviews/consumer:
    get:
      description: 'The consumer review resource provides input provided by consumers.

        - Notes:

        - If you pass in vehicleId, then you should not pass in yearId, makeId, modelId and vice versa.

        - If you pass in reviewIds, then you should not pass in vehicleId, yearId, makeId, modelId and vice versa.

        - Base vehicleId is going to be returned in the output when querying by yearId, makeId, modelId.'
      security:
      - keyQuery: []
      tags:
      - Vehicle
      parameters:
      - $ref: '#/components/parameters/version'
      - name: vehicleId
        in: query
        description: The KBB vehicle identifier
        required: false
        schema:
          type: integer
      - name: numberOfReviewsPerPage
        in: query
        description: Number of reviews per page
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: Sort type
        schema:
          type: integer
          enum:
          - MostHelpful
          - Newest
          - Oldest
          - HighestRating
          - LowestRating
      - name: currentPage
        in: query
        description: Desired Page
        required: false
        schema:
          type: integer
      - name: reviewIds
        in: query
        required: false
        description: Comma separated review ids
        schema:
          type: string
      - name: yearId
        in: query
        required: false
        description: Year ID
        schema:
          type: integer
      - name: makeId
        in: query
        required: false
        description: Make ID
        schema:
          type: integer
      - name: modelId
        in: query
        required: false
        description: Model ID
        schema:
          type: integer
      - $ref: '#/components/parameters/campaign-key'
      - $ref: '#/components/parameters/dataVersionId'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  required:
                  - consumerReviews
                  properties:
                    consumerReviews:
                      $ref: '#/components/schemas/ConsumerReviews'
      summary: Get by version reviews consumer
      x-summary-source: derived
      operationId: getByVersionReviewsConsumer
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.kbb.com/ads
