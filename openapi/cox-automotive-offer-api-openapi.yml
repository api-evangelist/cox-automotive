              - transmission
              - trim
              - tune-up
              - turbo-supercharger
              - two-inch
              - usb
              - vinyl
              - warning-light
              - wear
              - wear-tear
              - wheels
              - wheels-rims
              - window
          questionType:
            type: string
            enum:
            - YesNo
            - Text
            - Number
            - Enum
          label:
            type: string
  responses:
    ServerError:
      description: An internal server error has occured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    InvalidAuth:
      description: An unauthenticated operation has been attempted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
  parameters:
    apiKey:
      name: api_key
      description: Unique identifier to authorize the request
      in: query
      required: true
      x-valid: b0afc168-ff1d-4858-955e-4a375189ecd0
      x-invalid: afc168-ff1d-4858-955e-4a375189ecd
      schema:
        type: string
    offerId:
      name: offerId
      description: Unique identifier to represent an offer
      in: path
      required: true
      x-valid: b0afc168-ff1d-4858-955e-4a375189ec00
      x-invalid: afc168-ff1d-4858-955e-4a375189ec
      schema:
        type: string
  securitySchemes:
    keyQuery:
      type: apiKey
      name: api_key
      in: query
