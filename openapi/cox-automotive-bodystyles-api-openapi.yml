openapi: 3.2.0
info:
  version: v1
  title: IDWS Vehicle Service Body Styles API
servers:
- url: https://idws-sandbox.datasolutions.coxautoinc.com
security:
- apiKey: []
tags:
- name: BodyStyles
paths:
  /idws/vehicle/bodystyles:
    get:
      tags:
      - BodyStyles
      summary: Gets a list of Body Styles
      operationId: IdwsVehicleBodystylesGet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Server Error
components:
  securitySchemes:
    apiKey:
      name: api_key
      in: query
      type: apiKey
      description: Mashery API Key
