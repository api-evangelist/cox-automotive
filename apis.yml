- aid: cox-automotive:manheim-events
  name: Manheim Event Notifications
  description: >-
    Publish/subscribe business-event notification service for the Manheim auction lifecycle. Consumers
    register a subscriber, create subscriptions with resource, type, text (VIN) or richFilter criteria,
    and receive NOUN.VERB events (for example UNIT.CREATED, CONSIGNMENT.CREATED) delivered to their own
    callback, optionally expanded with the referenced API response. Superseded for new onboarding by
    Eventer on the Cox Automotive API Storefront.
  humanURL: https://developer.manheim.com/apis/events/index.html
  baseURL: https://api.manheim.com
  position: Producing
