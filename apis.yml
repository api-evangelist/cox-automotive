- aid: cox-automotive:manheim
  name: Manheim Hypermedia API Suite
  description: >-
    Manheim's third-party integration surface — a suite of hypermedia (href-linked) JSON REST APIs over
    the wholesale vehicle remarketing lifecycle: auction locations, inventory units and consignments,
    marketplace offerings, searches, purchases, transactions and titles, Manheim Market Report valuations
    and forecasts, vehicle condition reports, images, and user profiles, contexts and preferences. OAuth
    2.0 client-credentials and resource-owner-password grants through the Mashery gateway. Documented
    publicly; access granted per environment after review.
  humanURL: https://developer.manheim.com/
