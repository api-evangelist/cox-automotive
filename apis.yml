- aid: cox-automotive:integration-platform
  name: Cox Automotive Integration Platform (API Storefront)
  description: >-
    The company-wide API storefront and integration platform fronting Cox Automotive's partner APIs —
    Dealertrack credit application, registration and titling, DealXG and Deal Push, Eventer publishing,
    MMR and MMR batch, listings search, recon inventory, quotes, orders, purchases, condition reports,
    taxonomy, expander, service scheduling and digital retailing among more than seventy runtime services
    listed on the public status page. Product catalogue and reference are behind an Okta / Entra ID sign-in;
    access is requested through the storefront.
  humanURL: https://developer.coxautoinc.com/
  baseURL: https://api.coxautoinc.com
