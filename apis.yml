aid: cox-automotive
name: Cox Automotive
description: >-
  Cox Automotive is one of the world's largest providers of products and services spanning the automotive
  ecosystem, operating a portfolio of brands that includes Manheim (wholesale vehicle auctions and
  remarketing), Kelley Blue Book (vehicle valuations and editorial data), Autotrader, Dealertrack (DMS,
  registration and titling, credit applications), vAuto, VinSolutions, Xtime, Dealer.com, HomeNet and
  Esntial. Its public API surface is split across several developer properties: the Kelley Blue Book
  Developer Portal (developer.kbb.com) publishes Swagger 2.0 contracts for the IDWS 4.0 vehicle and
  editorial services, the Advertising Data API, the Instant Cash Offer API and the Batch VIN API; the
  Manheim Developer Portal (developer.manheim.com) documents a hypermedia REST suite covering auctions,
  inventory, marketplace offerings, valuations, condition reports, images, users and a publish/subscribe
  event notification service; and the Cox Automotive Integration Platform / API Storefront
  (developer.coxautoinc.com) fronts the partner-gated catalogue of more than seventy runtime services
  visible on the public Cox Automotive API status page. Access to every environment is granted after a
  review by a Cox Automotive account representative, with keys issued through the Boomi/Mashery gateway.
