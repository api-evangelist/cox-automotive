- aid: cox-automotive:kbb-batch-vin
  name: Kelley Blue Book Batch VIN API
  description: >-
    Asynchronous batch VIN decoding and valuation. Submit a batch job, poll its status, and retrieve the
    input and output files, or cancel a running job. Requires both a Mashery api_key and an OAuth-style
    bearer token obtained from the API's own /Token endpoint.
  humanURL: https://developer.kbb.com/batchvin/1-Default
