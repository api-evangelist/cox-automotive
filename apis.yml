- aid: cox-automotive:kbb-instant-cash-offer
  name: Kelley Blue Book Instant Cash Offer (ICO) API
  description: >-
    Produces a Kelley Blue Book Instant Cash Offer for a vehicle. Vehicle configuration lookups (year,
    make, model, trim, transmission, engine, drivetrain, colour, options), licence-plate-to-VIN lookup,
    prospect creation with history, condition and contact information, and offer creation and retrieval.
    Responses use a meta/data envelope with numeric Cox Automotive result codes.
  humanURL: https://developer.kbb.com/ico/1-Default
  baseURL: https://api.kbb.com/ico/v1
