finding: >-
  Cox Automotive publishes NO first-party client SDK for any of its documented public APIs. npm, PyPI,
  RubyGems, Maven Central, NuGet, pkg.go.dev, crates.io and Packagist were searched for Kelley Blue
  Book, Manheim, Dealertrack, VinSolutions and Cox Automotive client libraries, and the reference pages
  on developer.kbb.com, developer.manheim.com and developer.coxautoinc.com link to none. An integrator
  writes their own HTTP client against the Swagger 2.0 contracts or the hypermedia reference. What Cox
  Automotive DOES publish, and publishes actively, is internal cloud and delivery tooling under the
  Cox-Automotive and manheim GitHub organisations — ALKS (their AWS role-brokering service) has a
  maintained CLI, a JavaScript client and a Terraform provider, all released within the last two months.
  Those are catalogued below with official: true and api_client: false, because crediting them as SDKs
  would misrepresent the Kelley Blue Book and Manheim APIs as having client libraries when they do not.
  No SDKs pointer is wired in apis.yml for that reason.
